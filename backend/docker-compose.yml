
services:
  postgres:
    image: postgres:17.6
    container_name: sa-library-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    ports:
      - "${POSTGRES_PORT_OUTSIDE}:${POSTGRES_PORT}"
    volumes:
      - sa-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - sa-library-net

  redis:
    image: redis:8.2.2
    container_name: sa-library-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - sa-library-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: sa-library-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped
    networks:
      - sa-library-net
#
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sa-library-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: unless-stopped
    networks:
      - sa-library-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: sa-library-backend
    ports:
      - "${BACKEND_PORT_OUTSIDE}:${BACKEND_PORT}"
    depends_on:
      - postgres
      - redis
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: ${SPRING_REDIS_HOST}
      SPRING_REDIS_PORT: ${SPRING_REDIS_PORT}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_KEY: ${JWT_KEY}
    restart: unless-stopped
    networks:
      - sa-library-net

volumes:
  sa-pgdata:
  kafka-data:

networks:
  sa-library-net:
    driver: bridge
